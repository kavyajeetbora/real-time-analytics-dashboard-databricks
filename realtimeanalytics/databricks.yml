# This is a Declarative Automation Bundle definition for realtimeanalytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: realtimeanalytics
  uuid: c3460549-914d-47a6-bae0-907a9266c4b3

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets: 
      name_prefix: "[${bundle.target} ${workspace.current_user.short_name}]"
    workspace:
      host: https://dbc-dc2e804d-6eed.cloud.databricks.com
    variables:
      catalog_name: ride_analytics_dev
      schema_name: dev
  prod:
    mode: production
    presets: 
      name_prefix: "[${bundle.target} ${workspace.current_user.short_name}]"
    workspace:
      host: https://dbc-dc2e804d-6eed.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/charlieadam4678@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Production/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: ride_analytics_prod
      schema_name: prod
    permissions:
      - group_name: admins
        level: CAN_MANAGE
